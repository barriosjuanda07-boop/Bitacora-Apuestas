name: Actualizar partidos (ESPN)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_espn.py

permissions:
  contents: write

concurrency:
  group: partidos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar partidos
        run: python scripts/fetch_espn.py
      - name: Guardar cambios
        run: |
          git config user.name "bitacora-bot"
          git config user.email "bitacora-bot@users.noreply.github.com"
          git add partidos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Partidos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
